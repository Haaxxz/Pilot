name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project Eta.xcodeproj -scheme Eta

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project Eta.xcodeproj \
            -scheme Eta \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO"

      - name: Package IPA
        run: |
          # Find the built .app directory
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory and copy the .app inside
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Zip the Payload directory into an .ipa file
          zip -r9 Eta.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eta-Unsigned-IPA
          path: Eta.ipa

